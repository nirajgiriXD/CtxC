[workspace]
resolver = "2"
members = [
    "crates/ctxc-core",
    "crates/ctxc-context",
    "crates/ctxc-graph",
    "crates/ctxc-metrics",
    "crates/ctxc-dashboard",
    "crates/ctxc-integrations",
    "crates/ctxc-mcp",
    "crates/ctxc-semantic",
    "crates/ctxc-retrieval",
    "crates/ctxc-parser",
    "crates/ctxc-project",
    "crates/ctxc-api",
    "crates/ctxc-daemon",
    "crates/ctxc-watcher",
    "crates/ctxc-optimizer",
    "crates/ctxc-engine",
    "crates/ctxc-store",
    "crates/ctxc-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/nirajgirixd/ctxc"
authors = ["CtxC contributors"]

[workspace.dependencies]
ctxc-api = { path = "crates/ctxc-api", version = "0.1.0" }
ctxc-context = { path = "crates/ctxc-context", version = "0.1.0" }
ctxc-daemon = { path = "crates/ctxc-daemon", version = "0.1.0" }
ctxc-core = { path = "crates/ctxc-core", version = "0.1.0" }
ctxc-engine = { path = "crates/ctxc-engine", version = "0.1.0" }
ctxc-graph = { path = "crates/ctxc-graph", version = "0.1.0" }
ctxc-metrics = { path = "crates/ctxc-metrics", version = "0.1.0" }
ctxc-dashboard = { path = "crates/ctxc-dashboard", version = "0.1.0" }
ctxc-integrations = { path = "crates/ctxc-integrations", version = "0.1.0" }
ctxc-mcp = { path = "crates/ctxc-mcp", version = "0.1.0" }
ctxc-semantic = { path = "crates/ctxc-semantic", version = "0.1.0" }
ctxc-parser = { path = "crates/ctxc-parser", version = "0.1.0" }
ctxc-project = { path = "crates/ctxc-project", version = "0.1.0" }
ctxc-retrieval = { path = "crates/ctxc-retrieval", version = "0.1.0" }
ctxc-optimizer = { path = "crates/ctxc-optimizer", version = "0.1.0" }
ctxc-store = { path = "crates/ctxc-store", version = "0.1.0" }
ctxc-watcher = { path = "crates/ctxc-watcher", version = "0.1.0" }

anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws"] }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
