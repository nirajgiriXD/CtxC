[package]
name = "ctxc-cli"
description = "Command line interface for CtxC, the context compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ctxc"
path = "src/main.rs"

[features]
default = []
# Pass the exact GPT-4 tokenizer through to ctxc-core, for
# `budget.tokenizer = "cl100k"`. Off by default: it compiles a large
# vocabulary into the binary.
cl100k = ["ctxc-core/cl100k"]

[dependencies]
anstyle.workspace = true
anstyle-query.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
ctxc-context.workspace = true
ctxc-core.workspace = true
ctxc-dashboard.workspace = true
ctxc-api.workspace = true
ctxc-engine.workspace = true
ctxc-daemon.workspace = true
ctxc-graph.workspace = true
ctxc-integrations.workspace = true
ctxc-mcp.workspace = true
ctxc-metrics.workspace = true
ctxc-project.workspace = true
ctxc-retrieval.workspace = true
ctxc-semantic.workspace = true
ctxc-store.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
toml.workspace = true
