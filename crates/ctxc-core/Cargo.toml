[package]
name = "ctxc-core"
description = "Foundational types, errors, configuration and platform abstraction for CtxC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# The exact GPT-4 byte-pair encoder, for `budget.tokenizer = "cl100k"`. Off by
# default: it compiles a megabytes-large vocabulary into the binary, and CtxC's
# promise is that it works with no model and no download.
cl100k = ["dep:tiktoken-rs"]

[dependencies]
blake3.workspace = true
tiktoken-rs = { version = "0.7", optional = true }
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true

